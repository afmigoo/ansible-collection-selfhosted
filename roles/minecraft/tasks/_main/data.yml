---
- name: Look up the service user
  ansible.builtin.getent:
    database: passwd
    key: "{{ minecraft_user }}"
    fail_key: false

# In check mode a new user doesn't exist yet to own the files
- name: Write the data files
  when: (ansible_facts.getent_passwd | default({}))[minecraft_user] | default(none) is not none
  block:
    - name: Create the data dir
      ansible.builtin.file:
        path: "{{ _minecraft_data_dir }}"
        state: directory
        owner: "{{ minecraft_user }}"
        group: "{{ minecraft_user }}"
        mode: "0750"

    - name: Accept the EULA
      ansible.builtin.copy:
        content: "eula=true\n"
        dest: "{{ _minecraft_data_dir }}/eula.txt"
        owner: "{{ minecraft_user }}"
        group: "{{ minecraft_user }}"
        mode: "0644"
      register: __minecraft_eula

    # The server rewrites server.properties on every start but keeps the values, escaped the way Java's Properties
    # escapes them (\ = : # ! get a backslash), so write them that way to stay idempotent
    - name: Set the managed server.properties keys
      ansible.builtin.lineinfile:
        path: "{{ _minecraft_data_dir }}/server.properties"
        regexp: ^{{ __minecraft_property.key | regex_escape }}=
        line: >-
          {{ __minecraft_property.key }}={{ __minecraft_value | replace(_minecraft_bs, _minecraft_bs * 2)
             | replace('=', _minecraft_bs ~ '=') | replace(':', _minecraft_bs ~ ':')
             | replace('#', _minecraft_bs ~ '#') | replace('!', _minecraft_bs ~ '!') }}
        create: true
        owner: "{{ minecraft_user }}"
        group: "{{ minecraft_user }}"
        mode: "0644"
      vars:
        __minecraft_value: >-
          {{ __minecraft_property.value | string | lower if __minecraft_property.value is boolean
             else __minecraft_property.value | string }}
      loop: "{{ _minecraft_properties | dict2items }}"
      loop_control:
        loop_var: __minecraft_property
        label: "{{ __minecraft_property.key }}"
      register: __minecraft_properties

    - name: Set the RCON password
      ansible.builtin.lineinfile:
        path: "{{ _minecraft_data_dir }}/server.properties"
        regexp: ^rcon\.password=
        line: >-
          rcon.password={{ minecraft_rcon_password | replace(_minecraft_bs, _minecraft_bs * 2)
             | replace('=', _minecraft_bs ~ '=') | replace(':', _minecraft_bs ~ ':')
             | replace('#', _minecraft_bs ~ '#') | replace('!', _minecraft_bs ~ '!') }}
        create: true
        owner: "{{ minecraft_user }}"
        group: "{{ minecraft_user }}"
        mode: "0644"
      when: minecraft_enable_rcon | bool
      no_log: true
      register: __minecraft_rcon

    # Fabric loads every jar in data/mods. The role only downloads the listed ones and leaves other jars alone;
    # without a sha256 an existing file is kept as it is
    - name: Download the mods
      when: minecraft_backend == 'fabric'
      block:
        - name: Create the mods dir
          ansible.builtin.file:
            path: "{{ _minecraft_data_dir }}/mods"
            state: directory
            owner: "{{ minecraft_user }}"
            group: "{{ minecraft_user }}"
            mode: "0755"

        - name: Download the mods
          ansible.builtin.get_url:
            url: "{{ __minecraft_mod.url }}"
            dest: "{{ _minecraft_data_dir }}/mods/{{ __minecraft_mod.url | urlsplit('path') | basename }}"
            checksum: "{{ ('sha256:' ~ __minecraft_mod.sha256) if __minecraft_mod.sha256 is defined else omit }}"
            owner: "{{ minecraft_user }}"
            group: "{{ minecraft_user }}"
            mode: "0644"
          loop: "{{ _minecraft_spec.mods }}"
          loop_control:
            loop_var: __minecraft_mod
            label: "{{ __minecraft_mod.url }}"
          register: __minecraft_mods
