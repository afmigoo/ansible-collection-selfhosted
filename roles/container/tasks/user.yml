---
- name: Check container_user
  ansible.builtin.assert:
    that:
      - container_user is match('^[a-z_][a-z0-9_-]{0,31}$')
    fail_msg: >-
      container_user must be a valid user name (lowercase, up to 32 characters). Got '{{ container_user }}'.
    quiet: true

- name: Remember the expected home
  ansible.builtin.set_fact:
    _container_home: "{{ container_base_dir }}/{{ container_name }}"

- name: Create the base directory
  ansible.builtin.file:
    path: "{{ container_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Read-only: safe before the guard below, and in check mode
- name: Look up container_user before touching it
  ansible.builtin.getent:
    database: passwd
    key: "{{ container_user }}"
    fail_key: false

# getent with fail_key: false sets the key to None (not undefined) when it's missing
- name: Remember whether container_user already exists
  ansible.builtin.set_fact:
    _container_foreign: "{{ (ansible_facts.getent_passwd | default({}))[container_user] | default(none, true) }}"

# Never usermod, assign subuids or enable linger for an account this role didn't create itself
- name: Guard against a foreign account
  ansible.builtin.assert:
    that:
      - _container_foreign is none or _container_foreign[4] == _container_home
    # fail_msg is rendered even when the assert passes, so this can't index _container_foreign unconditionally
    fail_msg: >-
      {{ container_user }} already exists with home '{{ _container_foreign[4] if _container_foreign is not none else '' }}',
      not {{ _container_home }}. It's probably a package's or another service's account; choose another
      container_user or container_name.
    quiet: true

- name: Create the service user
  ansible.builtin.user:
    name: "{{ container_user }}"
    comment: "{{ container_name }} container (afmigoo.selfhosted)"
    system: true
    home: "{{ _container_home }}"
    create_home: true
    shell: /usr/sbin/nologin
  register: __container_user

# In check mode a new user doesn't exist yet to own it
- name: Restrict the service user's home
  ansible.builtin.file:
    path: "{{ _container_home }}"
    state: directory
    owner: "{{ container_user }}"
    group: "{{ container_user }}"
    mode: "0750"
  when: not (ansible_check_mode and __container_user is changed)

# System users get no subordinate ids from useradd. Give this one the next free block past every range handed
# out, so ranges never overlap
- name: Assign a subordinate id range
  ansible.builtin.shell:
    cmd: |
      set -eu
      if grep -q "^{{ container_user }}:" /etc/subuid && grep -q "^{{ container_user }}:" /etc/subgid; then
        exit 0
      fi
      touch /etc/subuid /etc/subgid
      start=$(awk -F: -v m={{ container_subid_start | int }} '{ e = $2 + $3; if (e > m) m = e } END { print m }' /etc/subuid /etc/subgid)
      end=$((start + {{ container_subid_count | int }} - 1))
      grep -q "^{{ container_user }}:" /etc/subuid || usermod --add-subuids "$start-$end" {{ container_user }}
      grep -q "^{{ container_user }}:" /etc/subgid || usermod --add-subgids "$start-$end" {{ container_user }}
      echo changed
    executable: /bin/bash
  register: __container_subid_setup
  changed_when: "'changed' in __container_subid_setup.stdout"

# Linger keeps the user's systemd running without a login, so the service starts at boot
- name: Enable lingering
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ container_user }}
    creates: /var/lib/systemd/linger/{{ container_user }}

- name: Look up the service user
  ansible.builtin.getent:
    database: passwd
    key: "{{ container_user }}"
    fail_key: false

# Empty in check mode when the user is new
- name: Remember the service user's uid
  ansible.builtin.set_fact:
    _container_uid: "{{ (ansible_facts.getent_passwd | default({}))[container_user][1] | default('', true) }}"

- name: Remember the service user's runtime dir
  ansible.builtin.set_fact:
    _container_runtime_dir: /run/user/{{ _container_uid }}

- name: Wait for the user's systemd
  ansible.builtin.wait_for:
    path: "{{ _container_runtime_dir }}/bus"
    timeout: 60
  when:
    - _container_uid | length > 0
    - not ansible_check_mode
