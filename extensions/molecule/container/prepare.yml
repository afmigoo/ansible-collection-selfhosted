---
- name: Prepare
  hosts: all
  gather_facts: false
  become: true
  tasks:
    # What afmigoo.provision.podman installs: uidmap for rootless podman, and acl because Molecule
    # logs in as vagrant, not root, so Ansible needs setfacl to become the service user
    - name: Install podman
      ansible.builtin.apt:
        name: [podman, uidmap, acl]
        state: present
        update_cache: true
        cache_valid_time: 3600

    # A plain account that happens to collide with container_name "guardtest"'s default container_user, to check
    # that the role's foreign-account guard refuses to touch it (verify.yml)
    - name: Create a foreign account colliding with a default container_user
      ansible.builtin.user:
        name: selfhosted-guardtest
        home: /home/selfhosted-guardtest
        create_home: true
