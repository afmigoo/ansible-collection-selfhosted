---
- name: Create the service user
  ansible.builtin.user:
    name: "{{ container_name }}"
    comment: "{{ container_name }} container (afmigoo.selfhosted)"
    system: true
    home: /var/lib/{{ container_name }}
    create_home: true
    shell: /usr/sbin/nologin
  register: __container_user

# In check mode a new user doesn't exist yet to own it
- name: Restrict the service user's home
  ansible.builtin.file:
    path: /var/lib/{{ container_name }}
    state: directory
    owner: "{{ container_name }}"
    group: "{{ container_name }}"
    mode: "0750"
  when: not (ansible_check_mode and __container_user is changed)

# System users get no subordinate ids from useradd. Give this one the next free block past every range handed
# out, so ranges never overlap
- name: Assign a subordinate id range
  ansible.builtin.shell:
    cmd: |
      set -eu
      if grep -q "^{{ container_name }}:" /etc/subuid && grep -q "^{{ container_name }}:" /etc/subgid; then
        exit 0
      fi
      touch /etc/subuid /etc/subgid
      start=$(awk -F: -v m={{ container_subid_start | int }} '{ e = $2 + $3; if (e > m) m = e } END { print m }' /etc/subuid /etc/subgid)
      end=$((start + {{ container_subid_count | int }} - 1))
      grep -q "^{{ container_name }}:" /etc/subuid || usermod --add-subuids "$start-$end" {{ container_name }}
      grep -q "^{{ container_name }}:" /etc/subgid || usermod --add-subgids "$start-$end" {{ container_name }}
      echo changed
    executable: /bin/bash
  register: __container_subid_setup
  changed_when: "'changed' in __container_subid_setup.stdout"

# Linger keeps the user's systemd running without a login, so the service starts at boot
- name: Enable lingering
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ container_name }}
    creates: /var/lib/systemd/linger/{{ container_name }}

- name: Look up the service user
  ansible.builtin.getent:
    database: passwd
    key: "{{ container_name }}"
    fail_key: false

# Empty in check mode when the user is new
- name: Remember the service user's uid
  ansible.builtin.set_fact:
    _container_uid: "{{ (ansible_facts.getent_passwd | default({}))[container_name][1] | default('', true) }}"

- name: Remember the service user's runtime dir
  ansible.builtin.set_fact:
    _container_runtime_dir: /run/user/{{ _container_uid }}

- name: Wait for the user's systemd
  ansible.builtin.wait_for:
    path: "{{ _container_runtime_dir }}/bus"
    timeout: 60
  when:
    - _container_uid | length > 0
    - not ansible_check_mode
