---
# Runs the verification entry point of every app role whose master gate is enabled,
# e.g. ansible-playbook afmigoo.selfhosted.verify -e minecraft_enable=true
- name: Verify self-hosted services
  hosts: "{{ selfhosted_hosts | default('all') }}"
  gather_facts: false
  become: true
  tasks:
    - name: Verify minecraft
      ansible.builtin.include_role:
        name: afmigoo.selfhosted.minecraft
        tasks_from: verification
      when: minecraft_enable | default(false) | bool
      tags: [verify]
