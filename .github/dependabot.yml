---
# Collections in requirements.yml are not covered: Dependabot has no Ansible Galaxy ecosystem
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # One PR for all updates of this ecosystem, so CI tests the set that gets merged
    groups:
      pip:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # One PR for all updates of this ecosystem, so CI tests the set that gets merged
    groups:
      github-actions:
        patterns: ["*"]
