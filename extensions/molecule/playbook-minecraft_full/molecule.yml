---
# Tests the minecraft_full playbook on bare hosts: no prepare.yml, since installing podman (afmigoo.provision.podman)
# is the playbook's job. Converge runs the playbook, then idempotence, then the verify playbooks of both collections.
# Vars come from group_vars/all/: minecraft.yml links to roles/minecraft/vars/test.yml, the other files hold what the
# dependency roles need.
# 2 vCPU and 3 GiB per VM, as in the minecraft scenario: 6 vCPU and 9 GiB for the three VMs at once, or run it with
# make test-playbook-minecraft_full SERIAL=1 for one VM at a time. Same boxes as ../config.yml.
platforms:
  - name: molecule-debian-13
    box: debian/trixie64
    cpus: 2
    memory: 3072
  - name: molecule-ubuntu-2404
    box: cloud-image/ubuntu-24.04-amd64
    box_url: file://${MOLECULE_SCENARIO_DIRECTORY}/../boxes/ubuntu-24.04.json
    cpus: 2
    memory: 3072
  - name: molecule-ubuntu-2604
    box: cloud-image/ubuntu-26.04-amd64
    box_url: file://${MOLECULE_SCENARIO_DIRECTORY}/../boxes/ubuntu-26.04.json
    cpus: 2
    memory: 3072
provisioner:
  name: ansible
  inventory:
    links:
      group_vars: group_vars
