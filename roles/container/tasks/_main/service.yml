---
# Quadlet units are generated, so they can't be enabled; [Install] WantedBy in the unit starts them at boot
- name: Start the service
  ansible.builtin.systemd_service:
    name: "{{ container_name }}.service"
    state: started
    scope: user
  become: true
  become_user: "{{ container_name }}"
  environment:
    XDG_RUNTIME_DIR: "{{ _container_runtime_dir }}"
  # In check mode a new unit isn't loaded yet
  when: not (ansible_check_mode and __container_unit is changed)
