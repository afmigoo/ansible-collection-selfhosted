---
# Paper Minecraft server. Needs podman >= 4.4 on the host already (e.g. from
# afmigoo.provision.podman) and the EULA accepted:
# ansible-playbook afmigoo.selfhosted.minecraft -e minecraft_eula=true
- name: Minecraft server
  hosts: "{{ selfhosted_hosts | default('all') }}"
  gather_facts: false
  become: true
  vars:
    minecraft_enable: true
  roles:
    - role: afmigoo.selfhosted.minecraft
