---
# Both run in the service user's systemd. main flushes them at its end, while this inclusion's vars are still in scope
- name: Reload the container's user systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ container_name }}"
  environment:
    XDG_RUNTIME_DIR: "{{ _container_runtime_dir }}"

- name: Restart the container service
  ansible.builtin.systemd_service:
    name: "{{ container_name }}.service"
    state: restarted
    scope: user
  become: true
  become_user: "{{ container_name }}"
  environment:
    XDG_RUNTIME_DIR: "{{ _container_runtime_dir }}"
